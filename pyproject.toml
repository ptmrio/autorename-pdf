[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
exclude = ["venv", "build", "dist", "gui", ".worktrees", ".superpowers"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", "build.py", "gui/*"]
