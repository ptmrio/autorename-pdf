# Academic papers, preprints, theses.
# Copy to config.yaml. Set ai.api_key (unless ollama).
# Filename: 20260101 Smith Nature Attention Is All You Need.pdf
# Empty journal/venue is omitted. Year-only dates become 01.01 of that year.
# Company aliases are not applied. One-run alternative: rename --profile academic

ai:
  provider: "openai"
  model: "gpt-5.6-luna"
  api_key: "your-api-key-here"
  base_url: ""
  temperature: 0.0
  max_retries: 2

pdf:
  max_pages: 3
  ocr: false
  vision: false
  text_quality_threshold: 0.3
  incoming_invoice: "AP"
  outgoing_invoice: "AR"

paddleocr:
  venv_path: ""
  language: "en"
  device: "auto"
  detection_model: ""
  det_limit_side_len: 736
  cpu_threads: 4

company:
  name: "Your Company Name"

output:
  language: "English"
  date_format: "%Y%m%d"

profile: academic              # only delta vs config.yaml.example; or: rename --profile academic
profiles: {}
prompt_extension: ""
