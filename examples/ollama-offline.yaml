# Fully local: Ollama LLM + PaddleOCR. No API key, no cloud after models are pulled.
# Copy to config.yaml. Install Ollama, run: ollama pull qwen3:4b
# Install PaddleOCR via setup.ps1. Keep Ollama running locally.
# Filename still uses the business shape: 20260906 ACME AP 12,13.pdf
# Scanned/image PDFs: use a vision model (qwen3-vl:8b) and set vision: true.

ai:
  provider: "ollama"              # default openai — local, no cloud
  model: "qwen3:4b"               # pull first: ollama pull qwen3:4b
  api_key: ""                     # must be empty for ollama
  base_url: ""
  temperature: 0.0
  max_retries: 2

pdf:
  max_pages: 3
  ocr: true                       # default false — PaddleOCR via setup.ps1
  vision: false
  text_quality_threshold: 0.3
  incoming_invoice: "AP"
  outgoing_invoice: "AR"

paddleocr:
  venv_path: ""
  language: "en"
  device: "auto"
  detection_model: ""
  det_limit_side_len: 736
  cpu_threads: 4

company:
  name: "Your Company Name"

output:
  language: "English"
  date_format: "%Y%m%d"

profile: business
profiles: {}
prompt_extension: ""
